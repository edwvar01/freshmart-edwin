<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Products</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/Navbar.css">
    <link rel="stylesheet" href="css/Footer.css">
    <link rel="stylesheet" href="css/Products.css">
    <link rel="stylesheet" href="css/ProductCard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    

</head>

<body>
    <div class="page-wrapper">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-container">
                <a href="home.html" class="navbar-logo">
                    <i data-lucide="leaf" class="logo-icon" width="28" height="28"></i> FreshMart
                </a>

                <div class="navbar-search desktop-search">
                    <form action="products.html">
                        <input type="text" name="search" placeholder="Search for fresh groceries...">
                        <button type="submit"><i data-lucide="search" width="20" height="20"></i></button>
                    </form>
                </div>

                <div class="navbar-links desktop-links">
                    <a href="home.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link"
                        style="color: var(--primary); font-weight: 600;">Products</a>
                    <a href="farmers.html" class="nav-link">Fresh Farmers</a>
                    <a href="orders.html" class="nav-link">Orders</a>
                </div>

                <div class="navbar-actions">
                    <a href="cart.html" class="nav-action-btn cart-btn">
                        <i data-lucide="shopping-cart" width="24" height="24"></i>
                        <span class="cart-badge">3</span>
                    </a>
                    <a href="index.html" class="nav-action-btn user-btn desktop-user">
                        <i data-lucide="user" width="24" height="24"></i>
                    </a>
                    <a href="index.html" class="nav-action-btn logout-btn" title="Logout" style="color: #ef4444;">
                        <i data-lucide="log-out" width="24" height="24"></i>
                    </a>
                </div>
            </div>
        </nav>

        <main class="main-content products-layout">
            <div class="products-container">

                <!-- Sidebar Filters -->
                <aside class="products-sidebar">
                    <div class="sidebar-widget">
                        <h3 class="widget-title"><i data-lucide="filter" width="18" height="18"></i> Categories</h3>
                        <ul class="category-list">
                            <li><button class="category-btn active">All</button></li>
                            <li><button class="category-btn">Vegetables</button></li>
                            <li><button class="category-btn">Fruits</button></li>
                            <li><button class="category-btn">Dairy</button></li>
                            <li><button class="category-btn">Grains</button></li>
                            <li><button class="category-btn">Organic Products</button></li>
                            <li><button class="category-btn">Discount Deals</button></li>
                        </ul>
                    </div>

                    <div class="sidebar-widget">
                        <h3 class="widget-title"><i data-lucide="sliders-horizontal" width="18" height="18"></i> Price
                            Range</h3>
                        <div class="price-filter">
                            <input type="range" min="0" max="500" class="price-slider">
                            <div class="price-labels">
                                <span>₹0</span>
                                <span>₹500+</span>
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-promo">
                        <h4>Fight Food Waste</h4>
                        <p>Buy "Near Expiry" items to save money and the planet!</p>
                        <button class="promo-btn">View Deals</button>
                    </div>
                </aside>

                <!-- Main Product Grid -->
                <section class="products-main">
                    <div class="products-header">
                        <div>
                            <h1 class="page-title">All Products</h1>
                            <p class="results-count">Showing 3 results</p>
                        </div>

                        <div class="products-search-bar">
                            <i data-lucide="search" width="20" height="20" class="search-icon"></i>
                            <input type="text" id="localSearchInput" placeholder="Search products...">
                        </div>
                    </div>

                    <div class="products-grid" id="mainProductsGrid">
                        <!-- Products will be injected here by JS -->
                    </div>
                </section>

            </div>
        </main>

        <!-- Footer (Simplified inclusion) -->
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-bottom">
                    <p>&copy; 2026 FreshMart. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', () => {
            const productsGrid = document.getElementById('mainProductsGrid');

            function renderStoreProducts() {
                let prodsStr = localStorage.getItem('fm_admin_products');
                let products = prodsStr ? JSON.parse(prodsStr) : [];

                if (products.length === 0) {
                    products = [
                        { id: 101, name: "Fresh Organic Carrots", price: 60, category: "Vegetables", weight: "1 kg", image: "https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?w=500&q=80", farmerName: "Green Valley Farms" },
                        { id: 102, name: "Sweet Pineapple (Near Expiry)", price: 90, originalPrice: 150, category: "Fruits", weight: "1 pc (approx 1.2kg)", image: "https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=500&q=80", farmerName: "Sunrise Orchards", isDiscount: true },
                        { id: 103, name: "Fresh Cow Milk", price: 65, category: "Dairy", weight: "1 Liter", image: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500&q=80", farmerName: "Happy Cow Dairy" }
                    ];
                    localStorage.setItem('fm_admin_products', JSON.stringify(products));
                }

                productsGrid.innerHTML = '';

                products.forEach(p => {
                    const isDiscount = p.isDiscount || false;
                    const discountBadges = isDiscount ? `
                        <div class="product-badges">
                            <span class="badge badge-warning">
                                <i data-lucide="clock" width="12" height="12"></i> 2 Days Left
                            </span>
                            <span class="badge badge-discount">-40%</span>
                        </div>` : '';

                    const priceHTML = isDiscount && p.originalPrice
                        ? `<span class="product-price">₹${p.price}</span><span class="product-original-price">₹${p.originalPrice}</span>`
                        : `<span class="product-price">₹${p.price}</span>`;

                    const sellerName = p.farmerName || p.seller || "FreshMart Verified";
                    const weightLabel = p.weight || "1 unit";

                    const cardHTML = `
                        <div class="product-card" onclick="window.location.href='product-details.html?id=${p.id}'">
                            <div class="product-image-container">
                                <img src="${p.image}" alt="${p.name}" class="product-image">
                                ${discountBadges}
                                <button class="wishlist-btn" onclick="event.stopPropagation()">
                                    <i data-lucide="heart" width="18" height="18"></i>
                                </button>
                            </div>
                            <div class="product-info">
                                <div class="product-meta">
                                    <span class="product-category">${p.category}</span>
                                    <span class="product-weight">${weightLabel}</span>
                                </div>
                                <h3 class="product-title">${p.name}</h3>
                                <div class="product-farmer">
                                    <i data-lucide="shield-check" width="14" height="14" class="verified-icon"></i>
                                    <span>${sellerName}</span>
                                </div>
                                <div class="product-rating">
                                    <span class="stars">★★★★★</span>
                                    <span class="rating-value">4.8</span>
                                </div>
                                <div class="product-bottom">
                                    <div class="product-price-container">
                                        ${priceHTML}
                                    </div>
                                    <button class="add-cart-btn" onclick="event.stopPropagation(); alert('Added to cart!');" title="Add to Cart">
                                        <i data-lucide="shopping-cart" width="18" height="18"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

                    productsGrid.insertAdjacentHTML('beforeend', cardHTML);
                });

                if (window.lucide) window.lucide.createIcons();
            }

            renderStoreProducts();

            const productCards = document.querySelectorAll('.product-card');
            const localSearchInput = document.getElementById('localSearchInput');
            const resultsCount = document.querySelector('.results-count');
            const categoryBtns = document.querySelectorAll('.category-btn');

            let currentSearch = '';
            let currentCategory = 'All';

            function filterProducts() {
                const term = currentSearch.toLowerCase().trim();
                let count = 0;

                productCards.forEach(card => {
                    const title = card.querySelector('.product-title').textContent.toLowerCase();
                    const category = card.querySelector('.product-category').textContent.trim();
                    const isDiscount = card.querySelector('.badge-discount') !== null;

                    const matchesSearch = title.includes(term);
                    let matchesCategory = false;

                    if (currentCategory === 'All') {
                        matchesCategory = true;
                    } else if (currentCategory === 'Discount Deals') {
                        matchesCategory = isDiscount;
                    } else if (currentCategory === 'Herbs & Spices') {
                        matchesCategory = category === 'Herbs';
                    } else if (currentCategory === 'Fresh Vegetables') {
                        matchesCategory = category === 'Vegetables';
                    } else if (currentCategory === 'Juicy Fruits') {
                        matchesCategory = category === 'Fruits';
                    } else if (currentCategory === 'Dairy & Eggs') {
                        matchesCategory = category === 'Dairy';
                    } else if (currentCategory === 'Grains & Pulses') {
                        matchesCategory = category === 'Grains';
                    } else {
                        // Direct match
                        matchesCategory = category === currentCategory || category.includes(currentCategory);
                    }

                    if (matchesSearch && matchesCategory) {
                        card.style.display = 'block';
                        count++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                if (resultsCount) {
                    resultsCount.textContent = `Showing ${count} results`;
                }
            }

            // Bind Category Clicks
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.textContent.trim();
                    filterProducts();
                });
            });

            // Check URL parameters first
            const urlParams = new URLSearchParams(window.location.search);
            const searchQuery = urlParams.get('search');
            const catQuery = urlParams.get('category'); // e.g., "Vegetables", "Discount"

            if (catQuery) {
                // Map the URL query back to the sidebar text for activation
                let mappedSidebarText = catQuery;
                if (catQuery === 'Discount') mappedSidebarText = 'Discount Deals';
                else if (catQuery === 'Herbs') mappedSidebarText = 'Herbs & Spices';

                // For simplified matching, if we get catQuery = Vegetables, the sidebar says "Vegetables".
                currentCategory = mappedSidebarText;

                // Update sidebar UI
                categoryBtns.forEach(b => {
                    if (b.textContent.trim().includes(catQuery) || b.textContent.trim() === mappedSidebarText) {
                        categoryBtns.forEach(cb => cb.classList.remove('active'));
                        b.classList.add('active');
                        // Ensure we use the exact text from the button for filtering logic if it matched
                        currentCategory = b.textContent.trim();
                    }
                });
            }

            if (searchQuery) {
                currentSearch = searchQuery;
                if (localSearchInput) {
                    localSearchInput.value = searchQuery;
                }
            }

            // Initial filter run
            filterProducts();

            // Listen to local search input
            if (localSearchInput) {
                localSearchInput.addEventListener('input', (e) => {
                    currentSearch = e.target.value;
                    filterProducts();
                });
            }
        });
    </script>
</body>

</html>
