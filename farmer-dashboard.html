<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Farmer Dashboard</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/Navbar.css">
    <link rel="stylesheet" href="css/Footer.css">
    <link rel="stylesheet" href="css/FarmerDashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    

</head>

<body>
    <div class="page-wrapper">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-container">
                <a href="home.html" class="navbar-logo">
                    <i data-lucide="leaf" class="logo-icon" width="28" height="28"></i> FreshMart
                </a>

                <div class="navbar-search desktop-search" style="opacity: 0;">
                    <!-- Hidden on dashboard to keep header clean -->
                </div>

                <div class="navbar-links desktop-links">
                    <a href="farmer-dashboard.html" class="nav-link"
                        style="color: var(--primary); font-weight: 600;">Dashboard</a>
                    <a href="products.html" class="nav-link">Storefront</a>
                </div>

                <div class="navbar-actions">
                    <a href="index.html" class="nav-action-btn user-btn desktop-user">
                        <i data-lucide="user" width="24" height="24"></i>
                    </a>
                    <a href="index.html" class="nav-action-btn logout-btn" title="Logout" style="color: #ef4444;">
                        <i data-lucide="log-out" width="24" height="24"></i>
                    </a>
                </div>
            </div>
        </nav>

        <main class="main-content dashboard-layout">
            <div class="dashboard-container">

                <div class="dashboard-header">
                    <h1>Farmer Dashboard</h1>
                    <p>Welcome back! Let's get your fresh produce online.</p>
                </div>

                <div class="dashboard-stats">
                    <div class="stat-card">
                        <div class="stat-icon"><i data-lucide="activity" width="24" height="24" color="#f59e0b"></i>
                        </div>
                        <div>
                            <p class="stat-title">Total Sales This Week</p>
                            <h3 class="stat-value">₹4,250</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i data-lucide="package-open" width="24" height="24" color="#3b82f6"></i>
                        </div>
                        <div>
                            <p class="stat-title">Active Inventory</p>
                            <h3 class="stat-value">8 Items</h3>
                        </div>
                    </div>
                </div>

                <div class="upload-section">
                    <div class="upload-header">
                        <h2><i data-lucide="plus" width="24" height="24"></i> Add New Product</h2>
                    </div>

                    <form id="farmerUploadForm" class="upload-form">
                        <div class="form-row">
                            <div class="input-block">
                                <label>Product Name</label>
                                <input type="text" name="name" required placeholder="e.g. Fresh Organic Carrots">
                            </div>
                            <div class="input-block">
                                <label>Selling Price (₹)</label>
                                <input type="number" name="price" required min="1" placeholder="e.g. 45">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="input-block">
                                <label>Category</label>
                                <select name="category">
                                    <option value="Vegetables">Vegetables</option>
                                    <option value="Fruits">Fruits</option>
                                    <option value="Dairy">Dairy</option>
                                    <option value="Grains">Grains</option>
                                    <option value="Organic Products">Organic Products</option>
                                </select>
                            </div>
                            <div class="input-block">
                                <label>Weight / Quantity Label</label>
                                <input type="text" name="weight" required placeholder="e.g. 1 kg, 1 Dozen, 500g">
                            </div>
                        </div>

                        <div class="input-block">
                            <label>Product Image URL</label>
                            <input type="url" name="image"
                                value="https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500" required
                                placeholder="https://link-to-your-image.com/image.jpg">
                            <p class="input-hint">For best results, use a square, well-lit photo of your product.</p>
                        </div>

                        <div class="form-row">
                            <div class="input-block">
                                <label>Farm/Shop Name (Public)</label>
                                <input type="text" name="farmer" value="Green Valley Farms" required>
                            </div>
                            <div class="input-block">
                                <label>Location (Public)</label>
                                <input type="text" name="farmLocation" value="Outskirts, Sector 62" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary submit-product-btn">Upload to Storefront</button>
                    </form>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-bottom">
                    <p>&copy; 2026 FreshMart. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // Farmer Product Upload Logic
        const uploadForm = document.getElementById('farmerUploadForm');
        if (uploadForm) {
            uploadForm.addEventListener('submit', (e) => {
                e.preventDefault();

                // Get pending products or initialize empty array
                const pendingProducts = JSON.parse(localStorage.getItem('fm_pending_products')) || [];

                // Create new product object
                const form = new FormData(uploadForm);
                const newProduct = {
                    id: Date.now(), // Generate unique ID
                    name: form.get('name'),
                    price: parseFloat(form.get('price')),
                    category: form.get('category'),
                    weight: form.get('weight'),
                    image: form.get('image'),
                    farmerName: form.get('farmer'),
                    farmLocation: form.get('farmLocation'),
                    seller: "Farmer", // Hardcoded per requirements
                    status: "Pending"
                };

                // Add to array and save back to local storage
                pendingProducts.push(newProduct);
                localStorage.setItem('fm_pending_products', JSON.stringify(pendingProducts));

                alert('Your product has been sent to the Admin for approval! It will appear on the storefront once verified.');
                uploadForm.reset();
            });
        }
    </script>
</body>

</html>
