<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Tracker</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/Navbar.css">
    <link rel="stylesheet" href="css/Footer.css">
    <link rel="stylesheet" href="css/OrderTracking.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="page-wrapper">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-container">
                <a href="home.html" class="navbar-logo">
                    <i data-lucide="leaf" class="logo-icon" width="28" height="28"></i> FreshMart
                </a>

                <div class="navbar-search desktop-search">
                    <form action="products.html">
                        <input type="text" name="search" placeholder="Search for fresh groceries...">
                        <button type="submit"><i data-lucide="search" width="20" height="20"></i></button>
                    </form>
                </div>

                <div class="navbar-links desktop-links">
                    <a href="home.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link">Products</a>
                    <a href="farmers.html" class="nav-link">Fresh Farmers</a>
                    <a href="orders.html" class="nav-link" style="color: var(--primary); font-weight: 600;">Orders</a>
                </div>

                <div class="navbar-actions">
                    <a href="cart.html" class="nav-action-btn cart-btn">
                        <i data-lucide="shopping-cart" width="24" height="24"></i>
                        <span class="cart-badge" id="cart-badge-count">0</span>
                    </a>
                    <a href="index.html" class="nav-action-btn user-btn desktop-user">
                        <i data-lucide="user" width="24" height="24"></i>
                    </a>
                    <a href="index.html" class="nav-action-btn logout-btn" title="Logout" style="color: #ef4444;">
                        <i data-lucide="log-out" width="24" height="24"></i>
                    </a>
                </div>
            </div>
        </nav>

        <main class="main-content order-layout">
            <div class="order-container">
                <div id="activeOrderContent" style="display: none;">
                    <h1 class="page-title" style="margin-bottom: 2rem;">Your Order History</h1>
                    <div id="ordersListContainer"></div>
                </div>

                <div id="emptyOrderContent" style="display: none; text-align: center; padding: 4rem 2rem; color: #64748b;">
                    <i data-lucide="package-x" width="60" height="60" style="margin-bottom: 1rem; opacity: 0.5;"></i>
                    <h2 id="emptyMsgTitle">No Active Orders</h2>
                    <p style="margin: 1rem 0 2rem;" id="emptyMsgDesc">You haven't placed any orders yet.</p>
                    <a href="products.html" class="btn btn-primary" style="display: inline-flex; text-decoration: none; padding: 1rem 2rem; border-radius: 12px; background: #2ECC71; color: white; font-weight: 600;">Start Shopping</a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-bottom">
                    <p>&copy; 2026 FreshMart. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.lucide) window.lucide.createIcons();
            
            const userJson = localStorage.getItem('fm_user');
            if (!userJson) {
                document.getElementById('emptyOrderContent').style.display = 'block';
                document.getElementById('emptyMsgTitle').innerText = "Please Log In";
                document.getElementById('emptyMsgDesc').innerText = "Log in to view your orders.";
                return;
            }
            const user = JSON.parse(userJson);

            try {
                const res = await fetch(`http://localhost:5000/api/orders?user=${encodeURIComponent(user.name)}`);
                const orders = await res.json();
                
                if (orders.length > 0) {
                    const activeContent = document.getElementById('activeOrderContent');
                    activeContent.style.display = 'block';
                    const listContainer = document.getElementById('ordersListContainer');
                    listContainer.innerHTML = '';
                    
                    orders.forEach(order => {
                        const isDelivered = order.status === 'Delivered';
                        const iconHtml = isDelivered 
                            ? `<i data-lucide="package-check" width="48" height="48" style="color: #2ECC71;"></i>`
                            : `<i data-lucide="package" width="48" height="48" style="color: #f59e0b;"></i>`;
                        const msgTitle = isDelivered ? 'Product Delivered' : 'Processing Order';
                        const msgDesc = isDelivered 
                            ? 'Your products have been delivered successfully. Enjoy your fresh groceries!' 
                            : 'Your order is confirmed and will be arriving soon.';
                            
                        const dateStr = order.createdAt ? new Date(order.createdAt).toLocaleDateString() : order.date;
                        
                        const orderCard = `
                            <div class="tracking-card" style="margin-bottom: 1.5rem; text-align: left; padding: 1.5rem;">
                                <div class="order-header" style="margin-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1rem;">
                                    <div>
                                        <h2 style="font-size: 1.25rem; color: #1e293b; margin: 0 0 0.25rem;">Order ${order.id}</h2>
                                        <p style="color: #64748b; font-size: 0.95rem; margin: 0;">Placed on ${dateStr} | Total: ₹${order.total.toFixed(2)}</p>
                                    </div>
                                    <div style="display: flex; gap: 1rem; align-items: center;">
                                        <div class="order-status-badge ${order.badgeClass || 'badge-warning'}">
                                            ${order.status}
                                        </div>
                                        ${order.qualityStatus === 'Uploaded' ? `<button onclick="viewQualityProof('${order.id}')" style="background: #2ECC71; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s;"><i data-lucide="image" width="16" height="16"></i> View Quality Proof</button>` : ''}
                                        ${!isDelivered ? `<button onclick="cancelOrder('${order.id}')" style="background: none; border: 1px solid #ef4444; color: #ef4444; padding: 0.3rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem; transition: all 0.2s;"><i data-lucide="x-circle" width="16" height="16"></i> Cancel Order</button>` : ''}
                                    </div>
                                </div>
                                <div style="display: flex; align-items: center; gap: 1.5rem;">
                                    <div style="background: ${isDelivered ? '#ecfdf5' : '#fef3c7'}; padding: 1rem; border-radius: 50%;">
                                        ${iconHtml}
                                    </div>
                                    <div>
                                        <h3 style="margin: 0 0 0.5rem; font-size: 1.2rem; color: #1e293b;">${msgTitle}</h3>
                                        <p style="margin: 0; color: #64748b; font-size: 1rem;">${msgDesc}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        listContainer.insertAdjacentHTML('beforeend', orderCard);
                    });
                    if (window.lucide) window.lucide.createIcons();
                } else {
                    document.getElementById('emptyOrderContent').style.display = 'block';
                }
            } catch(err) {
                console.error(err);
                document.getElementById('emptyOrderContent').style.display = 'block';
            }
        });

        window.cancelOrder = function(orderId) {
            showModernUserConfirm('Cancel Order?', 'Are you sure you want to cancel this order? This action cannot be undone.', 'danger', async () => {
                try {
                    const res = await fetch(`http://localhost:5000/api/orders/${orderId}`, { method: 'DELETE' });
                    if(res.ok) {
                        if(window.showToast) window.showToast('Order cancelled successfully.');
                        else alert('Order cancelled successfully.');
                        setTimeout(() => window.location.reload(), 1500);
                    } else {
                        if(window.showToast) window.showToast('Failed to cancel order.');
                        else alert('Failed to cancel order.');
                    }
                } catch(err) {
                    console.error('Error cancelling order', err);
                    if(window.showToast) window.showToast('Something went wrong. Could not cancel order.');
                    else alert('Something went wrong. Could not cancel order.');
                }
            });
        };

        window.showModernUserConfirm = function(title, message, type, onYes) {
            const overlay = document.createElement('div');
            Object.assign(overlay.style, {
                position: 'fixed',
                top: '0', left: '0', right: '0', bottom: '0',
                background: 'rgba(0,0,0,0.5)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                zIndex: '10000', opacity: '0', transition: 'all 0.3s ease'
            });
            
            const isDanger = type === 'danger';
            const iconColor = isDanger ? '#ef4444' : '#2ECC71';
            const lucideIcon = isDanger ? 'alert-circle' : 'help-circle';
            
            overlay.innerHTML = `
                <div style="background: white; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.9); transition: all 0.3s ease; text-align: center;">
                    <div style="color: ${iconColor}; margin-bottom: 1rem;"><i data-lucide="${lucideIcon}" width="48" height="48"></i></div>
                    <h3 style="margin: 0 0 1rem; color: #1e293b; font-size: 1.5rem;">${title}</h3>
                    <p style="margin: 0 0 2rem; color: #64748b;">${message}</p>
                    <div style="display: flex; gap: 1rem; justify-content: center;">
                        <button class="no-btn" style="padding: 0.75rem 1.5rem; border: none; background: #f1f5f9; color: #475569; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s;">No, Keep It</button>
                        <button class="yes-btn" style="padding: 0.75rem 1.5rem; border: none; background: ${iconColor}; color: white; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">Yes, Cancel</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(overlay);
            if (window.lucide) window.lucide.createIcons();
            
            requestAnimationFrame(() => {
                overlay.style.opacity = '1';
                overlay.firstElementChild.style.transform = 'scale(1)';
            });
            
            const close = () => {
                overlay.style.opacity = '0';
                overlay.firstElementChild.style.transform = 'scale(0.9)';
                setTimeout(() => overlay.remove(), 300);
            };
            
            overlay.querySelector('.no-btn').onclick = close;
            overlay.querySelector('.yes-btn').onclick = () => {
                const btn = overlay.querySelector('.yes-btn');
                btn.innerHTML = '<i data-lucide="loader" class="spin-icon" width="16" height="16"></i> Cancelling...';
                if(!document.getElementById('spin-style')) {
                    const style = document.createElement('style');
                    style.id = 'spin-style';
                    style.innerHTML = '@keyframes spin { 100% { transform: rotate(360deg); } } .spin-icon { animation: spin 1s linear infinite; }';
                    document.head.appendChild(style);
                }
                if (window.lucide) window.lucide.createIcons();
                onYes().finally(close);
            };
        };

        window.viewQualityProof = function(orderId) {
            const overlay = document.createElement('div');
            Object.assign(overlay.style, {
                position: 'fixed',
                top: '0', left: '0', right: '0', bottom: '0',
                background: 'rgba(0,0,0,0.8)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                zIndex: '10000', opacity: '0', transition: 'all 0.3s ease'
            });
            
            overlay.innerHTML = `
                <div style="background: white; padding: 1.5rem; border-radius: 16px; width: 90%; max-width: 600px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.9); transition: all 0.3s ease; text-align: center; position: relative;">
                    <button class="close-btn" style="position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; cursor: pointer; color: #64748b; transition: color 0.2s;">
                        <i data-lucide="x" width="24" height="24"></i>
                    </button>
                    <h3 style="margin: 0 0 1.5rem; color: #1e293b; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;"><i data-lucide="check-circle" width="28" height="28" style="color: #2ECC71;"></i> Quality Verification Proof</h3>
                    <div style="background: #f8fafc; padding: 1rem; border-radius: 12px; border: 1px dashed #cbd5e1;">
                        <img src="http://localhost:5000/api/orders/${orderId}/quality-photo" style="max-width: 100%; max-height: 60vh; border-radius: 8px; object-fit: contain;">
                    </div>
                </div>
            `;
            
            document.body.appendChild(overlay);
            if (window.lucide) window.lucide.createIcons();
            
            requestAnimationFrame(() => {
                overlay.style.opacity = '1';
                overlay.firstElementChild.style.transform = 'scale(1)';
            });
            
            const close = () => {
                overlay.style.opacity = '0';
                overlay.firstElementChild.style.transform = 'scale(0.9)';
                setTimeout(() => overlay.remove(), 300);
            };
            
            overlay.querySelector('.close-btn').addEventListener('click', close);
            overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
        };
    </script>
    <script src="js/auth-ui.js"></script>
</body>
</html>
