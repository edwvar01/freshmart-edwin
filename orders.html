<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Tracker</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/Navbar.css">
    <link rel="stylesheet" href="css/Footer.css">
    <link rel="stylesheet" href="css/OrderTracking.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    

</head>

<body>
    <div class="page-wrapper">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-container">
                <a href="home.html" class="navbar-logo">
                    <i data-lucide="leaf" class="logo-icon" width="28" height="28"></i> FreshMart
                </a>

                <div class="navbar-search desktop-search">
                    <form action="products.html">
                        <input type="text" name="search" placeholder="Search for fresh groceries...">
                        <button type="submit"><i data-lucide="search" width="20" height="20"></i></button>
                    </form>
                </div>

                <div class="navbar-links desktop-links">
                    <a href="home.html" class="nav-link">Home</a>
                    <a href="products.html" class="nav-link">Products</a>
                    <a href="farmers.html" class="nav-link">Fresh Farmers</a>
                    <a href="orders.html" class="nav-link" style="color: var(--primary); font-weight: 600;">Orders</a>
                </div>

                <div class="navbar-actions">
                    <a href="cart.html" class="nav-action-btn cart-btn">
                        <i data-lucide="shopping-cart" width="24" height="24"></i>
                        <span class="cart-badge">0</span>
                    </a>
                    <a href="index.html" class="nav-action-btn user-btn desktop-user">
                        <i data-lucide="user" width="24" height="24"></i>
                    </a>
                    <a href="index.html" class="nav-action-btn logout-btn" title="Logout" style="color: #ef4444;">
                        <i data-lucide="log-out" width="24" height="24"></i>
                    </a>
                </div>
            </div>
        </nav>

        <main class="main-content order-layout">
            <div class="order-container">
                <div id="activeOrderContent" style="display: none;">
                    <div class="order-header">
                        <div>
                        <h1 class="page-title">Order #FRSM-8924</h1>
                        <p class="order-date">Placed on March 10, 2026 at 10:45 AM</p>
                    </div>
                    <div class="order-status-badge">
                        Out for Delivery
                    </div>
                </div>

                <div class="tracking-card" style="text-align: center; padding: 3rem 1.5rem;">
                    <i data-lucide="check-circle-2" width="64" height="64" style="color: #2ECC71; margin-bottom: 1rem;"></i>
                    <h2 class="tracking-title" style="margin-bottom: 0.5rem; border: none; padding: 0;">Order Confirmed</h2>
                    <p style="color: #64748b; font-size: 1.1rem;">Your order is confirmed and will be arriving soon.</p>
                </div>
                </div>

                <div id="emptyOrderContent" style="display: none; text-align: center; padding: 4rem 2rem; color: #64748b;">
                    <i data-lucide="package-x" width="60" height="60" style="margin-bottom: 1rem; opacity: 0.5;"></i>
                    <h2>No Active Orders</h2>
                    <p style="margin: 1rem 0 2rem;">You haven't placed any orders yet.</p>
                    <a href="products.html" class="btn btn-primary" style="display: inline-flex; text-decoration: none; padding: 1rem 2rem; border-radius: 12px; background: #2ECC71; color: white; font-weight: 600;">Start Shopping</a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-container">
                <div class="footer-bottom">
                    <p>&copy; 2026 FreshMart. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', () => {
            const hasOrder = localStorage.getItem('fm_has_order') === 'true';
            if (hasOrder) {
                document.getElementById('activeOrderContent').style.display = 'block';
            } else {
                document.getElementById('emptyOrderContent').style.display = 'block';
            }
        });
    </script>
</body>

</html>
